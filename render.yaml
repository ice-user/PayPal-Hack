# Render Blueprint: one public web service (API + dashboard on one URL) for the judges.
# In Render: New > Blueprint > pick this repository. Render builds the Dockerfile and asks
# for the values marked sync: false (paste the PayPal SANDBOX app credentials there).
#
# What judges get:
# - PayPal is read live: the sandbox account's disputes, allowed seller actions and
#   shipment trackers are imported into the TechKart triage (backend/precedent/paypal_feed.py),
#   and every PayPal request shows in the dashboard's "PayPal API calls" log.
# - Approving "send message" or "provide evidence" on an imported dispute calls PayPal for real
#   (sandbox), after a fresh check that PayPal allows it. Refunds and offers stay simulated.
#   At most PRECEDENT_REAL_CALLS_PER_HOUR real actions an hour across all visitors.
# - Each browser gets its own in-memory demo workspace (PRECEDENT_PER_VISITOR=1).
# Without the PayPal values everything still works, simulated and labelled.
services:
  - type: web
    name: mediateai
    runtime: docker
    plan: starter            # always on (no cold start); "free" also works but sleeps when idle
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PRECEDENT_REAL_EXECUTION
        value: "1"
      - key: PRECEDENT_REAL_ACTIONS
        value: SEND_MESSAGE,PROVIDE_EVIDENCE
      - key: PRECEDENT_REAL_CALLS_PER_HOUR
        value: "20"
      - key: PRECEDENT_PER_VISITOR
        value: "1"
      - key: PRECEDENT_LLM_WRITER
        value: "0"
      - key: DEMO_DISPUTE_ID     # optional: the sandbox dispute linked to situation A
        sync: false
